name: Deploy to AWS EC2

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error title=Missing Secret::GitHub Repository Secret 'EC2_SSH_KEY'가 설정되지 않았습니다."
            echo "================================================================="
            echo "❌ 안내: GitHub 저장소 Settings > Secrets and variables > Actions에"
            echo "          'EC2_SSH_KEY' Secret(safe-food-map-key.pem 내용)을 등록해주세요."
            echo "================================================================="
            exit 1
          fi

      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '3.26.182.133' }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          script: |
            echo "=========================================="
            echo "🚀 [GitHub Actions] EC2 자동 배포 시작..."
            echo "=========================================="
            cd /home/ubuntu/app
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
            echo "=========================================="
            echo "✅ [GitHub Actions] EC2 자동 배포 완료!"
            echo "=========================================="
